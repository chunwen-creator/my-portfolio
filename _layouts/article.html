<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">My Portfolio</a>
  </header>

  <main class="article-container">
    <a class="back-link" href="{{ '/' | relative_url }}">← Home</a>

    <article>
      <h1>{{ page.title }}</h1>

      <div class="article-meta">
        <time datetime="{{ page.updatedAt | date_to_xmlschema }}">
          {{ page.updatedAt | date: "%Y-%m-%d" }}
        </time>
        <span>{{ page.category }}</span>
      </div>

      {% if page.cover %}
        <img class="article-cover" src="{{ page.cover | relative_url }}" alt="">
      {% endif %}

      <div class="article-body">
        {{ content }}
      </div>
    </article>
  </main>
</body>
</html>
