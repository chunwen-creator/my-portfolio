<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A personal collection of writing, reflections and visual works.">
  <title>My Portfolio</title>
  <style>
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 24px;
      background: #faf9f6;
      color: #393936;
      font-family: Georgia, "Noto Serif TC", serif;
      line-height: 1.8;
    }
    header { margin-bottom: 64px; }
    h1 { font-size: 28px; font-weight: 400; }
    nav { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 28px; }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }
    section { margin: 48px 0; }
    h2 { font-size: 18px; font-weight: 400; }
    p { color: #777; font-size: 14px; }
    footer { margin-top: 100px; color: #999; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      body { background: #20201e; color: #e5e2dc; }
      p, footer { color: #aaa69e; }
    }
  </style>
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <p>A quiet space for things I create and collect.</p>
    <nav>
      <a href="#reflections">作品心得</a>
      <a href="#writing">文學創作</a>
      <a href="#visual-works">圖像作品</a>
      <a href="#fragments">零碎想法</a>
    </nav>
  </header>

  <main>
    <section id="reflections">
      <h2>Reflections</h2>
      <p>作品心得</p>
    </section>

    <section id="writing">
      <h2>Writing</h2>
      <p>文學創作</p>
    </section>

    <section id="visual-works">
      <h2>Visual Works</h2>
      <p>圖像作品</p>
    </section>

    <section id="fragments">
      <h2>Fragments</h2>
      <p>零碎想法</p>
    </section>
  </main>

  <footer>
    © My Portfolio
  </footer>
</body>
</html>
